# Déploie Artful sur Infomaniak (FTP) à chaque push sur main/master.
# Secrets : ARTFUL_FTP_SERVER, ARTFUL_FTP_USERNAME, ARTFUL_FTP_PASSWORD
# Dossier cible fixe (logs Infomaniak) : sites/artfulbatinacreativestudios.fr/
name: Deploy Artful to Infomaniak

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: artful-infomaniak-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare production .htaccess
        run: cp .htaccess.production .htaccess

      - name: FTP deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.ARTFUL_FTP_SERVER }}
          username: ${{ secrets.ARTFUL_FTP_USERNAME }}
          password: ${{ secrets.ARTFUL_FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./
          server-dir: sites/artfulbatinacreativestudios.fr/
          dangerous-clean-slate: false
          exclude: |
            **/.git/**
            **/.git*
            **/.github/**
            **/.env
            **/.env.*
            **/*.sql
            **/logs/**
            **/*.log
            **/server.zip
            **/abcstudios_full.sql
            .htaccess.production
            **/vendor/**
            **/PHPMailer/**
            **/uploads/**
            **/src/**
            **/migrate-passwords.php
            **/generate-slugs.php
            **/install.php
            **/.phpinfo.php
            **/confirmation*.php
            **/contact_form.php
            **/send_mail.php
            **/mail_confirmation.php
            **/login.php
            **/logout.php
            **/signup.php
            **/profile.php*
            **/private-access.php
            **/database_connexion.php
            **/header.php
            **/footer.php
            **/banner.php
            **/functions.php
            **/social_links.php
            **/faq_contact.php

      - name: Post-deploy smoke (contenu, pas seulement HTTP 200)
        run: |
          set -euo pipefail
          home="$(curl -sS "https://artfulbatinacreativestudios.fr/fr/")"
          presse="$(curl -sS "https://artfulbatinacreativestudios.fr/fr/presse")"
          css="$(curl -sS "https://artfulbatinacreativestudios.fr/css/artful-premium.css?v=2.2.7")"

          echo "$home" | grep -q 'cedric-batina-studio' || {
            echo "::error::Home still missing studio portrait path"
            exit 1
          }
          echo "$home" | grep -q 'cedric-batina-founder.webp' && {
            echo "::error::Home still serves old founder.webp hero"
            exit 1
          }
          echo "$presse" | grep -q 'press\.body\|press\.title' && {
            echo "::error::Presse still shows untranslated press.* keys"
            exit 1
          }
          echo "$presse" | grep -q 'press-page' || {
            echo "::error::Presse body missing press-page class"
            exit 1
          }
          echo "$presse" | grep -q '2\.2\.7' || {
            echo "::error::Presse still on old asset version (want 2.2.7)"
            exit 1
          }
          echo "$css" | grep -q 'body.press-page' || {
            echo "::error::artful-premium.css missing press-page rules"
            exit 1
          }
          echo "Smoke OK: home portrait + presse layout CSS 2.2.7"

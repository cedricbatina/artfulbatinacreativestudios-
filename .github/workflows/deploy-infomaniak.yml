# Déploie Artful sur Infomaniak (FTP) à chaque push sur main/master.
# Secrets : ARTFUL_FTP_SERVER, ARTFUL_FTP_USERNAME, ARTFUL_FTP_PASSWORD
# ARTFUL_FTP_SERVER_DIR = sites/artfulbatinacreativestudios.fr/
#   (chemin réel vu dans les logs Infomaniak — PAS la racine FTP `/`)
name: Deploy Artful to Infomaniak

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: artful-infomaniak-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare production .htaccess
        run: cp .htaccess.production .htaccess

      - name: Resolve FTP server-dir
        id: ftpdir
        run: |
          DIR="${{ secrets.ARTFUL_FTP_SERVER_DIR }}"
          if [ -z "$DIR" ] || [ "$DIR" = "/" ] || [ "$DIR" = "./" ]; then
            DIR="sites/artfulbatinacreativestudios.fr/"
          fi
          case "$DIR" in
            */) ;;
            *) DIR="${DIR}/" ;;
          esac
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Deploying into FTP server-dir: $DIR"

      - name: FTP deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.ARTFUL_FTP_SERVER }}
          username: ${{ secrets.ARTFUL_FTP_USERNAME }}
          password: ${{ secrets.ARTFUL_FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./
          server-dir: ${{ steps.ftpdir.outputs.dir }}
          dangerous-clean-slate: false
          exclude: |
            **/.git/**
            **/.git*
            **/.github/**
            **/.env
            **/.env.*
            **/*.sql
            **/logs/**
            **/*.log
            **/server.zip
            **/abcstudios_full.sql
            .htaccess.production
            **/vendor/**
            **/PHPMailer/**
            **/uploads/**
            **/src/**
            **/migrate-passwords.php
            **/generate-slugs.php
            **/install.php
            **/.phpinfo.php
            **/confirmation*.php
            **/contact_form.php
            **/send_mail.php
            **/mail_confirmation.php
            **/login.php
            **/logout.php
            **/signup.php
            **/profile.php*
            **/private-access.php
            **/database_connexion.php
            **/header.php
            **/footer.php
            **/banner.php
            **/functions.php
            **/social_links.php
            **/faq_contact.php

      - name: Post-deploy smoke (contenu, pas seulement HTTP 200)
        run: |
          set -euo pipefail
          home="$(curl -sS "https://artfulbatinacreativestudios.fr/fr/")"
          presse="$(curl -sS "https://artfulbatinacreativestudios.fr/fr/presse")"

          echo "$home" | grep -q 'cedric-batina-studio' || {
            echo "::error::Home still missing studio portrait path"
            exit 1
          }
          echo "$home" | grep -q 'cedric-batina-founder.webp' && {
            echo "::error::Home still serves old founder.webp hero"
            exit 1
          }
          echo "$presse" | grep -q 'press\.body\|press\.title' && {
            echo "::error::Presse still shows untranslated press.* keys — locales not live"
            exit 1
          }
          echo "$presse" | grep -qi '<h1>Presse</h1>' || {
            echo "::error::Presse page missing expected H1"
            exit 1
          }
          echo "Smoke OK: home portrait + presse i18n"
